name: Something isn't working
description: Install, Home button, remote or anything else
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Stick model and Fire OS version
      description: Settings → My Fire TV → About
      placeholder: Fire TV Stick 3rd gen (AFTSSS), Fire OS 7.7.1.6
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you saw
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Output of `bash firetv.sh state`
      description: Paste backup/state.txt (it contains no passwords)
      render: text
  - type: checkboxes
    id: remote
    attributes:
      label: Remote
      options:
        - label: The remote still works after a restart
